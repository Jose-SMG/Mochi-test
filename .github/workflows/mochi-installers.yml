name: Coucou installers

on:
  push:
    branches: [main]
    paths: ['NotchBuddy/**', 'windows/**', 'shared/**', 'tests/**', 'scripts/**', 'mochi-preview.json', '.github/workflows/mochi-installers.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Stable queue key retained from the previous per-commit queue during migration.
  # New commits cancel superseded builds before they can publish an older source.
  group: mochi-preview-${{ github.ref }}-dd86bb9d8ef453539cd4141e9cf2a36f39df484d
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node scripts/check-preview-identity.mjs
      - run: python3 scripts/test-whats-new.py
      - run: rustc --test windows/preview-identity.rs -o /tmp/preview-policy && /tmp/preview-policy
  window-selection:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: cargo test --manifest-path tests/window-perch-native/Cargo.toml --locked -- --test-threads=1
  macos:
    name: Build independent universal macOS DMG
    needs: identity
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/cache/restore@v4
        id: mac-cache
        with:
          path: build/mochi-xcode
          key: mochi-preview-xcode-${{ hashFiles('NotchBuddy/project.yml') }}-${{ github.sha }}
          restore-keys: mochi-preview-xcode-
      - run: brew install xcodegen
      - run: bash scripts/build-mochi-macos.sh
      - uses: actions/cache/save@v4
        if: always() && steps.mac-cache.outputs.cache-hit != 'true'
        with:
          path: build/mochi-xcode
          key: ${{ steps.mac-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-Studio-Preview-macOS
          path: build/mochi-installers/macos/*
          if-no-files-found: error
  windows:
    name: Build independent Windows EXE and MSI
    needs: [identity, window-selection]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/cache/restore@v4
        id: windows-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: mochi-preview-windows-${{ hashFiles('windows/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mochi-preview-windows-${{ hashFiles('windows/Cargo.lock') }}-
            mochi-preview-windows-
            mochi-installers-windows-${{ hashFiles('windows/Cargo.lock') }}-
            mochi-installers-windows-
      - shell: pwsh
        run: ./scripts/build-mochi-windows.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: ${{ steps.windows-cache.outputs.cache-primary-key }}
      - name: Install, launch and uninstall without touching official Coucou
        shell: pwsh
        run: |
          $Installer = Get-ChildItem 'build/mochi-installers/windows/*-setup.exe'
          ./scripts/qa-preview-coexistence.ps1 -Installer $Installer.FullName
          Copy-Item build/coexistence/windows-coexistence.json build/mochi-installers/windows/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mochi-Studio-Preview-Windows
          path: build/mochi-installers/windows/*.*
          if-no-files-found: error
  publish:
    name: Publish only verified builds of this exact source
    needs: [identity, macos, windows]
    if: github.repository == 'Jose-SMG/Mochi-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: Mochi-Studio-Preview-*
          path: build/release-input
      - name: Verify hashes, identities, source and native coexistence
        run: python3 scripts/verify-preview-release.py build/release-input build/release
      - name: Publish independent community prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p 'require("./mochi-preview.json").tag')
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/$TAG"
          fi
          TITLE=$(node -p 'require("./mochi-preview.json").product_name + " " + require("./mochi-preview.json").version')
          gh release create "$TAG" --verify-tag --prerelease --title "$TITLE" --notes-file distribution/PREVIEW-RELEASE.md build/release/*
